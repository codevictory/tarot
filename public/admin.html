<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tarot-ylläpito</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="lang-picker" id="lang-picker" role="group" data-i18n-aria="lang.aria" aria-label="Kieli">
    <button type="button" class="lang-btn active" data-lang="fi" aria-pressed="true">FI</button>
    <button type="button" class="lang-btn" data-lang="en" aria-pressed="false">EN</button>
  </div>

  <header class="site-header">
    <h1 data-i18n="header.title">Tarot-korttien ylläpito</h1>
    <p class="subtitle" data-i18n="header.subtitle">Muokkaa korttien englannin- ja suomenkielisiä otsikoita ja kuvauksia (kuvaukset tukevat markdownia)</p>
  </header>

  <main id="admin-root" class="admin-root">
    <form id="login-form" class="admin-login" hidden>
      <h2 data-i18n="login.heading">Kirjaudu sisään</h2>
      <label for="login-username">
        <span data-i18n="login.username">Käyttäjätunnus</span>
        <input type="text" id="login-username" name="username" autocomplete="username" required />
      </label>
      <label for="login-password">
        <span data-i18n="login.password">Salasana</span>
        <input type="password" id="login-password" name="password" autocomplete="current-password" required />
      </label>
      <button type="submit" class="admin-btn primary" data-i18n="login.submit">Kirjaudu</button>
      <p id="login-error" class="admin-error" hidden></p>
    </form>

    <section id="editor" hidden>
      <div class="admin-toolbar">
        <input type="search" id="admin-filter" class="card-search" data-i18n-placeholder="filter.placeholder" data-i18n-aria="filter.aria" placeholder="Hae kortteja…" aria-label="Hae kortteja" autocomplete="off" />
        <span id="admin-user" class="admin-user"></span>
        <a href="/" class="admin-btn" data-i18n="nav.home">Korttigalleria</a>
        <button type="button" id="logout-btn" class="admin-btn" data-i18n="logout">Kirjaudu ulos</button>
      </div>
      <p id="editor-status" class="admin-status" hidden></p>
      <div id="card-forms" class="admin-card-forms"></div>
    </section>
  </main>

  <dialog id="image-dialog" class="card-dialog admin-image-dialog" data-i18n-aria="dialog.aria" aria-label="Korttikuva">
    <div class="admin-image-inner">
      <button id="image-dialog-close" class="dialog-close" data-i18n-aria="dialog.close" aria-label="Sulje">&times;</button>
      <img id="image-dialog-img" src="" alt="" />
    </div>
  </dialog>

  <script src="markdown.js"></script>
  <script src="admin.js"></script>
</body>
</html>
