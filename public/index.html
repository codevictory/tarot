<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tarot Lintujärvi</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="lang-picker" id="lang-picker" role="group" data-i18n-aria="lang.aria" aria-label="Kieli">
    <button type="button" class="lang-btn active" data-lang="fi" aria-pressed="true">FI</button>
    <button type="button" class="lang-btn" data-lang="en" aria-pressed="false">EN</button>
  </div>

  <header class="site-header">
    <h1 data-i18n="header.title">Tarot Lintujärvi</h1>
    <p class="subtitle" data-i18n="header.subtitle">Tulkintojani ja ajatuksiani korteista sekä Tarot-symboliikasta. Käyn sivustoa läpi ja korvaan tekoäly tekstejä omillani kortti kerrallaan.</p>
  </header>

  <nav class="filter-bar" data-i18n-aria="nav.aria" aria-label="Suodata kortteja">
    <div class="filter-inner">
      <input type="search" id="card-search" class="card-search" data-i18n-placeholder="search.placeholder" data-i18n-aria="search.aria" placeholder="Hae kortteja nimen tai merkityksen mukaan&hellip;" aria-label="Hae kortteja" autocomplete="off" />
      <button type="button" id="daily-card-btn" class="daily-btn" data-i18n="dailyCard" data-i18n-aria="dailyCard.aria" aria-label="Nosta päivän kortti" disabled>Päivän kortti</button>
      <div class="filter-buttons" id="filter-buttons" role="group" data-i18n-aria="filters.aria" aria-label="Suodata arkanan mukaan">
        <button type="button" class="filter-btn active" data-arcana="All" data-i18n="filter.All" aria-pressed="true">Kaikki</button>
        <button type="button" class="filter-btn" data-arcana="Major Arcana" data-i18n="filter.Major Arcana" aria-pressed="false">Iso arkana</button>
        <button type="button" class="filter-btn" data-arcana="Wands" data-i18n="filter.Wands" aria-pressed="false">Sauvat</button>
        <button type="button" class="filter-btn" data-arcana="Cups" data-i18n="filter.Cups" aria-pressed="false">Maljat</button>
        <button type="button" class="filter-btn" data-arcana="Swords" data-i18n="filter.Swords" aria-pressed="false">Miekat</button>
        <button type="button" class="filter-btn" data-arcana="Pentacles" data-i18n="filter.Pentacles" aria-pressed="false">Pentakelit</button>
      </div>
    </div>
  </nav>

  <main id="gallery" class="gallery" aria-live="polite">
    <p class="loading" data-i18n="loading">Ladataan pakkaa&hellip;</p>
  </main>

  <dialog id="card-dialog" class="card-dialog" aria-labelledby="dialog-title">
    <div class="dialog-inner">
      <button id="dialog-close" class="dialog-close" data-i18n-aria="dialog.close" aria-label="Sulje">&times;</button>
      <div class="dialog-image">
        <img id="dialog-img" src="" alt="" />
      </div>
      <div class="dialog-text">
        <p id="dialog-arcana" class="dialog-arcana"></p>
        <span id="dialog-ai-tag" class="ai-tag dialog-ai-tag" data-i18n="aiTag" hidden>Written by AI</span>
        <h2 id="dialog-title"></h2>
        <div id="dialog-description" class="dialog-description markdown"></div>
      </div>
    </div>
  </dialog>

  <script src="markdown.js"></script>
  <script src="app.js"></script>
</body>
</html>
